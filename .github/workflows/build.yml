name: Backend build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tasktrack_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: tasktrack_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - name: Initialize disposable CI database
        env:
          PGPASSWORD: test_only
        run: psql -h localhost -U tasktrack_test -d tasktrack_test -v ON_ERROR_STOP=1 -f database/TaskManagementDB_Postgres.sql
      - name: API integration tests
        env:
          ConnectionStrings__TaskManagement: Host=localhost;Port=5432;Database=tasktrack_test;Username=tasktrack_test;Password=test_only
          ASPNETCORE_ENVIRONMENT: Production
        run: |
          dotnet run --project TaskTrack.API --configuration Release --no-build --no-launch-profile --urls http://localhost:5081 > /tmp/tasktrack-api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:5081/health/ready && break || sleep 1; done
          python3 tests/api_integration.py http://localhost:5081
